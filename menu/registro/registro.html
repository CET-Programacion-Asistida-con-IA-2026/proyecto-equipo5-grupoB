  <link rel="stylesheet" href="registro.css">
  <link rel="stylesheet" href="../hero-common.css">
</head>

<body>
  <!-- HEADER--->
  <header class="site-header" id="inicio">
    <nav class="navbar">
      <a class="logo" href="../../index.html" aria-label="Volver al inicio">
        <img src="../../stoptheloop.svg" alt="Logo de Stop the Loop">
      </a>

      <!--Menú (NAVBAR) Principal-->
      <ul class="nav-links" id="nav-links">
        <li><a href="../aprende/aprende.html">Aprendé</a></li>
        <li><a href="../organizate/organizate.html">Organizate</a></li>
        <li><a href="../bienestar/bienestar.html">Bienestar</a></li>
        <li><a href="../comunidad/comunidad.html">Comunidad</a></li>
      </ul>

      <div class="nav-derecha">
        <a id="btn-nav-registro" class="btn btn-nav btn-registrate" href="../registro/registro.html"
          data-default-text="Registrate" data-account-text="Mi Cuenta" aria-label="Registrate">Registrate</a>
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>
  <main>
    <!-- SECCIÓN FORMULARIO DE REGISTRO -->
    <div class="auth-container">
      <div id="bloque-registro" class="auth-card auth-card--registro">
        <h2 class="auth-title">Creá tu Perfil de Estudiante</h2>
        <p class="auth-copy">Personalizá tu experiencia en el sitio según tu plan de estudio.</p>

        <form id="registro-form" class="auth-form">
          <div class="auth-field">
            <label for="reg-nombre">Nombre:</label>
            <input type="text" id="reg-nombre" required placeholder="Ej: Lucía">
          </div>

          <div class="auth-field">
            <label for="reg-nivel">Nivel de estudio actual:</label>
            <select id="reg-nivel" required>
              <option value="">Seleccioná tu nivel...</option>
              <option value="secundaria">Secundaria</option>
              <option value="universidad">Universidad / Terciario</option>
              <option value="posgrado">Posgrado</option>
              <option value="otro">Otros (Autodidacta / Cursos)</option>
            </select>
          </div>

          <div class="auth-field">
            <label for="reg-orientacion">Orientación o Rama de tu Plan:</label>
            <select id="reg-orientacion" required>
              <option value="">Seleccioná primero tu nivel...</option>
              <option value="exactas">Técnica / Ciencias Exactas / Ingeniería</option>
              <option value="sociales">Humanidades / Ciencias Sociales / Derecho</option>
              <option value="economicas">Economía / Comercial / Administración</option>
              <option value="salud">Ciencias de la Salud / Biología</option>
              <option value="arte">Arte / Diseño</option>
            </select>
          </div>

          <button type="submit" class="btn auth-submit">Crear Cuenta</button>
        </form>
      </div>

      <div id="bloque-mi-cuenta" class="auth-card auth-card--cuenta">
        <h2 class="auth-title">Mi Cuenta</h2>
        <p class="auth-copy">¡Qué bueno verte de nuevo por acá!</p>

        <div class="auth-account-info">
          <p><strong>Estudiante:</strong> <span id="perfil-nombre-vista"></span></p>
          <p><strong>Nivel:</strong> <span id="perfil-nivel-vista"></span></p>
          <p><strong>Orientación:</strong> <span id="perfil-orientacion-vista"></span></p>
        </div>

        <button id="btn-cerrar-sesion" class="btn auth-logout">Cerrar Sesión</button>
      </div>
    </div>












  </main>
  <footer class="footer">
    <div class="footer-logo">
      <a href="../../index.html" aria-label="Volver al inicio">
        <span><strong>STOP THE LOOP</strong> </span>
      </a>
    </div>
    <p>Stop the Loop &copy; 2026</p>
  </footer>
  <script src="registro.js"></script>

</html>
